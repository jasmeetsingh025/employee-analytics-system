# Database connection
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/employee_analytics
    username: postgres
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  profiles:
    active: local
  config:
    import: application-${spring.profiles.active}.yaml
  # JPA settings
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# App port
server:
  port: 8080
